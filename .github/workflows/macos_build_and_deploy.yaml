name: macOS Build and Submit to App Store

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Version tag to release"
        required: true
        type: string
      ref:
        description: "Optional branch or tag from which to create the release tag"
        required: false
        type: string
      release_mode:
        description: "Release automatically after App Review or wait for manual release"
        required: false
        default: "after_approval"
        type: string
      submit_for_review:
        description: "Submit after upload; disable to validate a build without publishing"
        required: false
        default: true
        type: boolean
    secrets:
      APP_STORE_CONNECT_APP_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or existing release tag to release"
        required: true
        default: "main"
        type: string
      submit_for_review:
        description: "Submit the uploaded build to App Review"
        required: true
        default: true
        type: boolean
      release_mode:
        description: "When to publish after App Review"
        required: true
        default: "after_approval"
        type: choice
        options:
          - after_approval
          - manual

permissions:
  contents: write

concurrency:
  group: macos-app-store-${{ inputs.release_tag || inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Create or verify release tag
    if: ${{ inputs.ref != '' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-source

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: release-source
          fetch-depth: 0

      - name: Create or verify immutable version tag
        id: release
        uses: ./workflow-source/.github/actions/prepare-versioned-release
        with:
          source-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}

  submit_macos:
    name: Build on GitHub and submit macOS
    needs: prepare_release
    if: ${{ always() && (inputs.ref == '' || needs.prepare_release.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.ref != '' && needs.prepare_release.outputs.release_tag || inputs.release_tag }}
      RELEASE_MODE: ${{ inputs.release_mode || 'after_approval' }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-source

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          fetch-depth: 0

      - name: Validate release inputs
        working-directory: release-source
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(awk '$1 == "version:" { print $2; exit }' open_wearable/pubspec.yaml)
          version=${version//\"/}
          version=${version//\'/}
          public_version=${version%%+*}
          expected_tag="v${public_version}"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Tag '$RELEASE_TAG' does not match pubspec version '$public_version'."
            exit 1
          fi

          version_notes_dir="open_wearable/release_notes/${public_version}"
          notes_dir="$version_notes_dir"
          if [ ! -s "$notes_dir/default.txt" ]; then
            notes_dir="open_wearable/release_notes"
            echo "Using generic release notes because $version_notes_dir/default.txt is missing."
          fi
          if [ ! -s "$notes_dir/default.txt" ]; then
            echo "::error::Missing version-specific release notes at $version_notes_dir/default.txt and fallback release notes at $notes_dir/default.txt."
            exit 1
          fi

          case "$RELEASE_MODE" in
            after_approval) release_type=AFTER_APPROVAL ;;
            manual) release_type=MANUAL ;;
            *)
              echo "::error::Unsupported release mode '$RELEASE_MODE'."
              exit 1
              ;;
          esac

          echo "version=$public_version" >> "$GITHUB_OUTPUT"
          echo "notes_dir=release-source/$notes_dir" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.3

      - name: Build and upload macOS
        id: upload
        uses: ./workflow-source/.github/actions/apple-build-upload
        with:
          platform: macos
          app-dir: release-source/open_wearable
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Wait for processing and submit to App Review
        env:
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          BUILD_NUMBER: ${{ steps.upload.outputs.build_number }}
          PUBLIC_VERSION: ${{ steps.release.outputs.version }}
          NOTES_DIR: ${{ steps.release.outputs.notes_dir }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
        run: |
          args=()
          if [ "$SUBMIT_FOR_REVIEW" != true ]; then args+=(--process-only); fi
          ruby workflow-source/.github/scripts/app_store_connect_release.rb \
            --app-id "$APP_STORE_CONNECT_APP_ID" \
            --platform MAC_OS \
            --version "$PUBLIC_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --release-notes-dir "$NOTES_DIR" \
            --release-type "$RELEASE_TYPE" "${args[@]}"

      - name: Summarize submission
        if: ${{ inputs.submit_for_review }}
        run: |
          printf 'Submitted macOS **%s** to App Review with release mode **%s**.\n' \
            "${{ steps.release.outputs.version }}" "$RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"

  publish_github_release:
    name: Publish GitHub Release
    needs: [prepare_release, submit_macos]
    if: ${{ inputs.ref != '' && inputs.submit_for_review && needs.submit_macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-source

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.release_tag }}
          path: release-source
          fetch-depth: 0

      - name: Create or update GitHub Release
        uses: ./workflow-source/.github/actions/publish-versioned-release
        with:
          source-directory: release-source
          release-tag: ${{ needs.prepare_release.outputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
