name: Android Build and Deploy to Play Store

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        type: string
      release_type:
        description: "Google Play track"
        required: true
        type: string
      publish_github_release:
        description: "Create the version tag and GitHub Release"
        required: false
        default: true
        type: boolean
      create_version_bump_pr:
        description: "Open the post-release version bump PR"
        required: false
        default: true
        type: boolean
      version_bump_base_ref:
        description: "Branch to target with the post-release version bump PR"
        required: false
        default: ""
        type: string
    outputs:
      released_sha:
        value: ${{ jobs.deploy_for_android.outputs.released_sha }}
      released_version:
        value: ${{ jobs.deploy_for_android.outputs.released_version }}
      public_version:
        value: ${{ jobs.deploy_for_android.outputs.public_version }}
      release_tag:
        value: ${{ jobs.deploy_for_android.outputs.release_tag }}
      next_version:
        value: ${{ jobs.deploy_for_android.outputs.next_version }}
    secrets:
      OPEN_WEARABLE_APP_ANDROID_DEPLOYMENT_KEY_PATH__FILE:
        required: true
      OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PASSWORD:
        required: true
      OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PATH__FILE:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "main"
        type: string
      release_type:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - production
      publish_github_release:
        description: "Create the version tag and GitHub Release for production"
        required: true
        default: true
        type: boolean
      create_version_bump_pr:
        description: "Open a version bump PR after production"
        required: true
        default: true
        type: boolean
      version_bump_base_ref:
        description: "Branch to target with the post-release version bump PR"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy_for_android:
    runs-on: ubuntu-latest
    outputs:
      released_sha: ${{ steps.version.outputs.released_sha }}
      released_version: ${{ steps.version.outputs.released_version }}
      public_version: ${{ steps.version.outputs.public_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      next_version: ${{ steps.version.outputs.next_version }}
      release_notes_path: ${{ steps.version.outputs.release_notes_path }}
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(awk '$1 == "version:" { print $2; exit }' open_wearable/pubspec.yaml)
          version=${version//\"/}
          version=${version//\'/}
          version_pattern='^([0-9]+)\.([0-9]+)\.([0-9]+)(\+[0-9]+)?$'
          if ! [[ "$version" =~ $version_pattern ]]; then
            echo "::error::Version '$version' must use major.minor.patch with an optional numeric +build suffix."
            exit 1
          fi

          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          build_suffix=${BASH_REMATCH[4]}
          public_version=${version%%+*}
          next_version="${major}.${minor}.$((10#$patch + 1))${build_suffix}"

          if [ "$RELEASE_TYPE" = "production" ]; then
            version_notes_path="open_wearable/release_notes/${public_version}/default.txt"
            fallback_notes_path="open_wearable/release_notes/default.txt"
            notes_path="$version_notes_path"
            if [ ! -s "$notes_path" ]; then
              notes_path="$fallback_notes_path"
              echo "Using generic release notes because $version_notes_path is missing."
            fi
            if [ ! -s "$notes_path" ]; then
              echo "::error::Missing version-specific release notes at $version_notes_path and fallback release notes at $fallback_notes_path."
              exit 1
            fi
          else
            notes_path=""
          fi

          echo "released_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "released_version=$version" >> "$GITHUB_OUTPUT"
          echo "public_version=$public_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${public_version}" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "release_notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.3

      - name: Set up Android build
        uses: ./.github/actions/android-build-prepare
        with:
          app-dir: open_wearable
          clean: "true"
          analyze: "true"

      - name: Decode Android signing key
        run: |
          echo "${{ secrets.OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PATH__FILE }}" | base64 --decode > android_keystore_temp.keystore
          echo "OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PATH=$(realpath android_keystore_temp.keystore)" >> "$GITHUB_ENV"

      - name: Decode Google Play service account
        run: |
          echo "${{ secrets.OPEN_WEARABLE_APP_ANDROID_DEPLOYMENT_KEY_PATH__FILE }}" | base64 --decode > android_deployment_key.json
          echo "OPEN_WEARABLE_APP_ANDROID_DEPLOYMENT_KEY_PATH=$(realpath android_deployment_key.json)" >> "$GITHUB_ENV"

      - name: Prepare Google Play release notes
        if: ${{ inputs.release_type == 'production' }}
        run: |
          changelog_dir="open_wearable/android/fastlane/metadata/android/en-US/changelogs"
          mkdir -p "$changelog_dir"
          cp "${{ steps.version.outputs.release_notes_path }}" "$changelog_dir/default.txt"

      - name: Set up Fastlane
        working-directory: open_wearable/android
        run: bundle install

      - name: Build and deploy Android internal release
        if: ${{ inputs.release_type == 'internal' }}
        working-directory: open_wearable/android
        run: bundle exec fastlane internal_deploy
        env:
          OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PASSWORD }}

      - name: Build and deploy Android production release
        if: ${{ inputs.release_type == 'production' }}
        working-directory: open_wearable/android
        run: bundle exec fastlane production_deploy
        env:
          OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPEN_WEARABLE_APP_ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload signed release APK
        if: ${{ inputs.release_type == 'production' }}
        uses: actions/upload-artifact@v6
        with:
          name: android-release-${{ steps.version.outputs.public_version }}
          path: open_wearable/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Summarize successful Play Store upload
        run: |
          printf 'Successfully uploaded Android **%s** to the **%s** track on Google Play.\n' \
            "${{ steps.version.outputs.public_version }}" "$RELEASE_TYPE" >> "$GITHUB_STEP_SUMMARY"

  publish_github_release:
    name: Tag version and publish GitHub Release
    needs: deploy_for_android
    if: ${{ inputs.release_type == 'production' && inputs.publish_github_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy_for_android.outputs.released_sha }}
          fetch-depth: 0

      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          name: android-release-${{ needs.deploy_for_android.outputs.public_version }}
          path: release-apk

      - name: Create immutable version tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED_SHA: ${{ needs.deploy_for_android.outputs.released_sha }}
          RELEASED_VERSION: ${{ needs.deploy_for_android.outputs.released_version }}
          RELEASE_TAG: ${{ needs.deploy_for_android.outputs.release_tag }}
          NOTES_PATH: ${{ needs.deploy_for_android.outputs.release_notes_path }}
        run: |
          set -euo pipefail

          public_version=${RELEASED_VERSION%%+*}
          notes_path="$NOTES_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tagged_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$tagged_sha" != "$RELEASED_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already points to $tagged_sha, not $RELEASED_SHA."
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$RELEASED_SHA" -m "OpenWearable $public_version"
            git push origin "$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenWearable $public_version" \
              --notes-file "$notes_path"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "OpenWearable $public_version" \
              --notes-file "$notes_path"
          fi

          gh release upload "$RELEASE_TAG" \
            "release-apk/app-release.apk#OpenWearable-${public_version}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  create_version_bump_pr:
    name: Create version bump PR for review
    needs: deploy_for_android
    if: ${{ inputs.release_type == 'production' && inputs.create_version_bump_pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy_for_android.outputs.released_sha }}

      - name: Open version bump PR
        shell: bash
        env:
          VERSION_FILE: open_wearable/pubspec.yaml
          BASE_BRANCH: ${{ inputs.version_bump_base_ref || inputs.ref }}
          RELEASED_VERSION: ${{ needs.deploy_for_android.outputs.released_version }}
          NEXT_VERSION: ${{ needs.deploy_for_android.outputs.next_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          bump_branch="automation/bump-version-${NEXT_VERSION}-${GITHUB_RUN_ID}"
          commit_message="chore(version): bump version to ${NEXT_VERSION}"
          pr_url=$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$bump_branch" \
            --state all \
            --json url \
            --jq '.[0].url // empty')

          if [ -z "$pr_url" ]; then
            remote_branch=$(git ls-remote --heads origin "refs/heads/$bump_branch")
            if [ -z "$remote_branch" ]; then
              git switch -c "$bump_branch"
              sed -i "s|^version:.*|version: $NEXT_VERSION|" "$VERSION_FILE"
              git add "$VERSION_FILE"
              git commit -m "$commit_message"
              git push --set-upstream origin "$bump_branch"
            fi

            body_file=$(mktemp)
            printf '%s\n' \
              "The production Play Store upload of version $RELEASED_VERSION succeeded." \
              "" \
              "Bumps the app version to $NEXT_VERSION for the next release." \
              "Please review and merge this PR using the repository's normal approval process." \
              > "$body_file"
            pr_url=$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$bump_branch" \
              --title "$commit_message" \
              --body-file "$body_file")
          fi

          printf 'Version bump PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
