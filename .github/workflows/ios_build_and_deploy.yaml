name: Diagnose Apple PR cancellations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Read cancelled PR build diagnostics
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ruby .github/scripts/diagnose_apple_archives.rb
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apple-pr-diagnosis
          path: apple-pr-diagnosis.json
          retention-days: 3
