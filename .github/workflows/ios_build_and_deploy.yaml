name: Diagnose Apple archive failures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Verify corrected TestFlight archives
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ruby .github/scripts/diagnose_apple_archives.rb
      - name: Save archive verification results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apple-archive-verification
          path: apple-archive-verification.json
          retention-days: 3
